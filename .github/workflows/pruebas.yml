name: Pruebas de API
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postman:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: biblioteca
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: prueba-aislada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca -d biblioteca"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/biblioteca
      DB_USER: biblioteca
      DB_PASSWORD: prueba-aislada
      ADMIN_EMAIL: admin@universidad.test
      ADMIN_PASSWORD: Administracion-Pruebas-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mvn -B package
      - name: Ejecutar colección Postman con Newman
        shell: bash
        run: |
          export JWT_SECRET="$(openssl rand -base64 32)"
          java -jar target/biblioteca-universitaria-1.0.0.jar > api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for intento in $(seq 1 60); do
            if curl -fsS http://localhost:8080/v3/api-docs -o /dev/null; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat api.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/v3/api-docs -o /dev/null || { cat api.log; exit 1; }
          npx --yes newman@6.2.1 run postman/Biblioteca.postman_collection.json \
            --env-var "adminEmail=$ADMIN_EMAIL" --env-var "adminPassword=$ADMIN_PASSWORD" \
            -r cli,junit --reporter-junit-export postman-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-postman
          path: postman-results.xml
